    function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain1.gain.setValueAtTime(0.3, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start();
        osc1.stop(ctx.currentTime + 0.55);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, ctx.currentTime + 0.16);
        gain2.gain.setValueAtTime(0.35, ctx.currentTime + 0.16);
        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.85);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.16);
        osc2.stop(ctx.currentTime + 0.85);
      } catch (err) {
        console.warn('Audio blocked or not supported:', err);
      }
    }

    const API_BASE = window.location.protocol.startsWith('http')
      ? (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? (window.location.port === '5000' ? '' : 'http://localhost:5000')
        : ''
      : 'http://localhost:5000';

    let socketClient = null;
    try {
      if (typeof io !== 'undefined') {
        socketClient = io(API_BASE || window.location.origin, {
          transports: ['websocket', 'polling'],
          reconnectionAttempts: 15,
          reconnectionDelay: 1000,
        });
      }
    } catch (e) {
      console.warn('Socket.IO initialization error:', e);
    }

    function App() {
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [menuCatalog, setMenuCatalog] = useState(MENU_CATALOG);
      const [syncStatus, setSyncStatus] = useState('connecting'); // 'connected' | 'connecting' | 'offline'

      // currentStation: 'home' (3 role options selection) | 'student' | 'kitchen' | 'delivery' | 'tv'
      const [currentStation, setCurrentStation] = useState('home');
      const [soundMuted, setSoundMuted] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [lastAnnouncedToken, setLastAnnouncedToken] = useState(101);
      const lastChimedTokenRef = useRef(null);

      const showToast = (message) => {
        setToastMsg(message);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const announceOrderReady = (token, recipient) => {
        setLastAnnouncedToken(token);
        if (!soundMuted) {
          playChime();
        }
        showToast(`Token #${token} is READY for ${recipient}!`);
      };

      const handleAnnounce = (token, recipient) => {
        announceOrderReady(token, recipient);
        if (socketClient && socketClient.connected) {
          socketClient.emit('chime:ring', { token, recipient });
        }
      };

      // Fetch dynamic menu from MongoDB
      const fetchMenu = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/menu`);
          const json = await res.json();
          if (json.success && Array.isArray(json.data) && json.data.length > 0) {
            setMenuCatalog(json.data);
          }
        } catch (err) {
          console.warn('Menu fetch failed, fallback active:', err);
        }
      };

      // Fetch orders from MongoDB
      const fetchOrders = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/orders`);
          const json = await res.json();
          if (json.success && Array.isArray(json.data)) {
            setOrders(json.data);
            setSyncStatus('connected');
          }
        } catch (err) {
          console.warn('Orders fetch failed:', err);
          setSyncStatus('offline');
        }
      };

      // Initial data fetch
      useEffect(() => {
        fetchMenu();
        fetchOrders();
      }, []);

      // Real-time synchronization via Socket.IO
      useEffect(() => {
        if (!socketClient) return;

        const onConnect = () => {
          setSyncStatus('connected');
          fetchOrders();
          fetchMenu();
        };

        const onDisconnect = () => {
          setSyncStatus('offline');
        };

        const onConnectError = () => {
          setSyncStatus('offline');
        };

        const onOrderCreated = (newOrder) => {
          setOrders((prev) => {
            const exists = prev.some(
              (o) => (o.orderId && o.orderId === newOrder.orderId) || (o.id && o.id === newOrder.id)
            );
            if (exists) return prev;
            return [newOrder, ...prev];
          });
        };

        const onOrderUpdated = (updatedOrder) => {
          setOrders((prev) =>
            prev.map((ord) => {
              if (
                ord.id === updatedOrder.id ||
                ord.orderId === updatedOrder.orderId ||
                ord._id === updatedOrder._id
              ) {
                return { ...ord, ...updatedOrder };
              }
              return ord;
            })
          );
        };

        const onStatusChanged = ({ orderId, id, token, status }) => {
          setOrders((prev) =>
            prev.map((ord) => {
              if (ord.orderId === orderId || ord.id === id || ord.id === orderId) {
                return { ...ord, status };
              }
              return ord;
            })
          );
        };

        const onOrderReady = ({ token, recipient }) => {
          // Avoid duplicate chime for the same token
          if (lastChimedTokenRef.current !== token) {
            lastChimedTokenRef.current = token;
            announceOrderReady(token, recipient || 'Student');
          }
        };

        const onOrderDeleted = ({ orderId, id }) => {
          setOrders((prev) =>
            prev.filter((o) => o.orderId !== orderId && o.id !== id && o.id !== orderId)
          );
        };

        const onOrdersReset = (resetOrders) => {
          setOrders(resetOrders);
          setLastAnnouncedToken(101);
          showToast('MongoDB demo orders restored.');
        };

        const onChimePlay = ({ token, recipient }) => {
          announceOrderReady(token, recipient);
        };

        socketClient.on('connect', onConnect);
        socketClient.on('disconnect', onDisconnect);
        socketClient.on('connect_error', onConnectError);
        socketClient.on('order:created', onOrderCreated);
        socketClient.on('order:updated', onOrderUpdated);
        socketClient.on('order:statusChanged', onStatusChanged);
        socketClient.on('order:ready', onOrderReady);
        socketClient.on('order:deleted', onOrderDeleted);
        socketClient.on('orders:reset', onOrdersReset);
        socketClient.on('chime:play', onChimePlay);

        return () => {
          socketClient.off('connect', onConnect);
          socketClient.off('disconnect', onDisconnect);
          socketClient.off('connect_error', onConnectError);
          socketClient.off('order:created', onOrderCreated);
          socketClient.off('order:updated', onOrderUpdated);
          socketClient.off('order:statusChanged', onStatusChanged);
          socketClient.off('order:ready', onOrderReady);
          socketClient.off('order:deleted', onOrderDeleted);
          socketClient.off('orders:reset', onOrdersReset);
          socketClient.off('chime:play', onChimePlay);
        };
      }, [soundMuted]);

      // Join station room
      useEffect(() => {
        if (socketClient && socketClient.connected) {
          socketClient.emit('join:station', currentStation);
        }
      }, [currentStation]);

      // Handle order status transition with MongoDB API
      const handleStatusTransition = async (orderId, newStatus) => {
        // Optimistic local update
        setOrders((prev) =>
          prev.map((ord) => {
            if (ord.id === orderId || ord.orderId === orderId || ord._id === orderId) {
              if (newStatus === 'ready' && ord.status !== 'ready') {
                announceOrderReady(
                  ord.token || ord.tokenNumber,
                  ord.type === 'dine-in' ? ord.tableNumber : 'Dine-Out Pickup'
                );
              }
              return { ...ord, status: newStatus };
            }
            return ord;
          })
        );

        try {
          const res = await fetch(`${API_BASE}/api/orders/${orderId}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus }),
          });
          const json = await res.json();
          if (!json.success) {
            showToast(`Status update failed: ${json.message}`);
            fetchOrders();
          }
        } catch (err) {
          console.error('Status transition error:', err);
          fetchOrders();
        }
      };

      // Handle place order with MongoDB API
      const handlePlaceOrder = async (newOrderData) => {
        try {
          const res = await fetch(`${API_BASE}/api/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newOrderData),
          });
          const json = await res.json();
          if (json.success && json.data) {
            const placed = json.data;
            const assignedToken = placed.tokenNumber || placed.token;
            showToast(`Success! Your Token #${assignedToken} sent to Kitchen`);
            setOrders((prev) => {
              const exists = prev.some(
                (o) => (o.orderId && o.orderId === placed.orderId) || (o.id && o.id === placed.id)
              );
              if (exists) return prev;
              return [placed, ...prev];
            });
            return assignedToken;
          } else {
            throw new Error(json.message || 'Failed to place order');
          }
        } catch (err) {
          console.error('Order placement error:', err);
          showToast(`Order failed: ${err.message}`);
          return null;
        }
      };

      // Handle delete order with MongoDB API
      const handleDeleteOrder = async (orderId) => {
        setOrders((prev) =>
          prev.filter((o) => o.id !== orderId && o.orderId !== orderId && o._id !== orderId)
        );
        showToast('Order removed.');

        try {
          await fetch(`${API_BASE}/api/orders/${orderId}`, {

          });
        } catch (err) {

      // Handle reset demo with MongoDB API
      const handleResetDemo = async () => {

            setLastAnnouncedToken(101);
            showToast('Synchronized demo data reset.');
          } else {
            setOrders(INITIAL_ORDERS);
            setLastAnnouncedToken(101);
            showToast('Synchronized demo data reset locally.');
          }
        } catch (err) {
          setOrders(INITIAL_ORDERS);
          setLastAnnouncedToken(101);
          showToast('Synchronized demo data reset locally.');
        }
      };

      const orderedQueue = useMemo(() => orders.filter(o => o.status === 'ordered'), [orders]);
      const cookingQueue = useMemo(() => orders.filter(o => o.status === 'cooking'), [orders]);
      const readyQueue = useMemo(() => orders.filter(o => o.status === 'ready'), [orders]);

    function StationStudentOrdering({ orders, onPlaceOrder, onSelectStation, menuCatalog }) {
      const [orderType, setOrderType] = useState('dine-in');
      const [tableNumber, setTableNumber] = useState('Table 1');
      const [studentName, setStudentName] = useState('');
      const [notes, setNotes] = useState('');
      const [cart, setCart] = useState({});
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [placedTokenModal, setPlacedTokenModal] = useState(null);

      const [searchQuery, setSearchQuery] = useState('');
      const [searchedOrder, setSearchedOrder] = useState(null);

      const categories = ['All', 'Grills & Rolls', 'South Indian', 'Meals & Bowls', 'Beverages'];

      const filteredMenu = useMemo(() => {
        if (categoryFilter === 'All') return menuCatalog;
        return menuCatalog.filter(item => item.category === categoryFilter);
      }, [categoryFilter, menuCatalog]);

      const addToCart = (dish) => {
        setCart(prev => ({
          ...prev,
          [dish.id]: {
            ...dish,
            qty: (prev[dish.id]?.qty || 0) + 1
          }
        }));
      };

      const removeFromCart = (dishId) => {
        setCart(prev => {
          if (!prev[dishId]) return prev;
          const newQty = prev[dishId].qty - 1;
          if (newQty <= 0) {
            const copy = { ...prev };
            delete copy[dishId];
            return copy;
          }
          return {
            ...prev,
            [dishId]: { ...prev[dishId], qty: newQty }
          };
        });
      };

      const cartItemsList = Object.values(cart);
      const cartTotal = cartItemsList.reduce((sum, item) => sum + item.price * item.qty, 0);

      const handleSubmitOrder = async (e) => {
        e.preventDefault();
        if (cartItemsList.length === 0) return;

        const assignedCounter = cartItemsList.some(i => (i.category || '').toLowerCase().includes('south indian'))
          ? 'Counter C (South Indian)'
          : cartItemsList.some(i => (i.category || '').toLowerCase().includes('beverages'))
          ? 'Counter B (Beverages & Bakery)'
          : 'Counter A (Hot Grills)';

        const newOrderPayload = {
          studentName: studentName.trim() || 'Student Guest',
          type: orderType,
          orderType: orderType,
          tableNumber: orderType === 'dine-in' ? tableNumber : 'Takeaway Pack',
          counter: assignedCounter,
          items: cartItemsList.map(i => ({
            id: i.id || i._id,
            menuItemId: i._id || (i.id && i.id.length === 24 ? i.id : undefined),
            name: i.name,
            qty: i.qty,
            quantity: i.qty,
            price: i.price,
            category: i.category,
          })),
          total: cartTotal,
          totalAmount: cartTotal,
          specialNotes: notes.trim()
        };

        const generatedToken = await onPlaceOrder(newOrderPayload);
        if (generatedToken) {
          setPlacedTokenModal({ token: generatedToken, type: orderType, table: orderType === 'dine-in' ? tableNumber : 'Takeaway Pack' });
          setCart({});
          setStudentName('');
          setNotes('');
        }
      };

      const handleLookup = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;
        const num = parseInt(searchQuery.replace(/\D/g, ''), 10);
        let match = orders.find(o => (o.token === num || o.tokenNumber === num) || (o.studentName && o.studentName.toLowerCase().includes(searchQuery.toLowerCase())));
        if (!match && !isNaN(num)) {
          try {
            const res = await fetch(`${API_BASE}/api/orders/token/${num}`);
            const json = await res.json();
            if (json.success && json.data) {
              match = json.data;
            }
          } catch (err) {
            console.warn('Track lookup error:', err);
          }
        }
        setSearchedOrder(match || 'NOT_FOUND');
      };

      return (
        <div className="space-y-6">
          {/* Station Banner */}
          <div className="bg-gradient-to-r from-amber-950/40 via-slate-900 to-slate-900 border border-amber-500/30 rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2 text-amber-400 font-bold text-xs uppercase tracking-wider">
                <Icons.Utensils className="w-4 h-4" />
                <span>Station 1: Student Self-Ordering & Tracker</span>
              </div>
              <h2 className="text-xl sm:text-2xl font-extrabold text-white mt-1">
                Choose Dine-In Table or Quick Dine-Out
              </h2>
              <p className="text-xs text-slate-400 mt-0.5">
                Customize your meal. Once placed, your ticket will appear instantly in the Kitchen.
              </p>
            </div>

            {/* Quick tracker search form */}
            <form onSubmit={handleLookup} className="flex items-center gap-2 w-full md:w-auto">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Track Token # (e.g. 104)"
                className="bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-xs text-white focus:outline-none focus:border-amber-400 font-mono-num w-full sm:w-44"
              />
              <button
                type="submit"
                className="px-3 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition"
              >
                Track
              </button>
            </form>
          </div>

          {/* Searched Ticket Result Card if searched */}
          {searchedOrder && (
            <div className="bg-slate-900 border border-slate-700 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xl">
              {searchedOrder === 'NOT_FOUND' ? (
                <div className="text-xs text-rose-400">
                  Ticket not found. Please verify your receipt token number.
                </div>
              ) : (
                <>
                  <div className="flex items-center space-x-3">
                    <div className="w-12 h-12 rounded-xl bg-slate-950 border border-slate-700 flex items-center justify-center font-mono-num font-black text-xl text-amber-400">
                      #{searchedOrder.token}
                    </div>
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="text-sm font-bold text-white">{searchedOrder.studentName}</span>
                        <span className="text-[11px] text-slate-400">({searchedOrder.type === 'dine-in' ? searchedOrder.tableNumber : 'Dine-Out Takeaway'})</span>
                      </div>
                      <div className="text-xs text-slate-400 mt-0.5">
                        {searchedOrder.items.map(i => `${i.name} (x${i.qty})`).join(', ')}
                      </div>
                    </div>
                  </div>

                  <div>
                    {searchedOrder.status === 'ready' && (
                      <span className="px-3 py-1.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-lg text-xs font-bold flex items-center space-x-1">
                        <Icons.CheckCircle className="w-4 h-4 text-emerald-400" />
                        <span>READY AT {searchedOrder.counter.toUpperCase()}</span>
                      </span>
                    )}
                    {searchedOrder.status === 'cooking' && (
                      <span className="px-3 py-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-bold flex items-center space-x-1">
                        <Icons.Clock className="w-4 h-4 text-amber-400" />
                        <span>NOW SIZZLING IN KITCHEN</span>
                      </span>
                    )}
                    {searchedOrder.status === 'ordered' && (
                      <span className="px-3 py-1.5 bg-sky-500/20 text-sky-300 border border-sky-500/40 rounded-lg text-xs font-semibold">
                        In Queue: Awaiting Chef Pickup
                      </span>
                    )}
                    {searchedOrder.status === 'delivered' && (
                      <span className="px-3 py-1.5 bg-slate-800 text-slate-400 rounded-lg text-xs">
                        Delivered & Enjoyed
                      </span>
                    )}
                  </div>
                </>
              )}
            </div>
          )}

          {/* Ordering Grid: Left Menu, Right Cart & Options */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            {/* MENU ITEMS COLUMN */}
            <div className="lg:col-span-7 xl:col-span-8 space-y-4">
              
              {/* Category Filter Pills */}

                  <button
                    key={cat}
                    type="button"
                    onClick={() => setCategoryFilter(cat)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap ${
                      categoryFilter === cat
                        ? 'bg-amber-500 text-slate-950 font-bold'
                        : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'
                    }`}
                  >
                    {cat}

    function KitchenTicketCard({ order, onStatusChange, onDeleteOrder }) {

      const toggleCheck = (idx) => {
        setCheckedItems(prev => ({
          ...prev,
          [idx]: !prev[idx]
        }));
      };

      const isCooking = order.status === 'cooking';
      const isReady = order.status === 'ready';

      return (
        <div className={`rounded-2xl p-4 border flex flex-col justify-between transition shadow-xl ${
          isCooking
            ? 'bg-slate-900 border-amber-500/50 ring-1 ring-amber-500/30'

            ? 'bg-slate-900/70 border-emerald-500/30'
            : 'bg-slate-900 border-slate-800'
        }`}>
          <div>
            {/* Ticket Header */}
            <div className="flex items-start justify-between pb-3 border-b border-slate-800">

                <div className="flex items-center space-x-2">
                  <span className="text-2xl font-black font-mono-num text-white">

                  <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded-full border ${
                    order.type === 'dine-in'
                      ? 'bg-purple-500/10 text-purple-400 border-purple-500/30'
                      : 'bg-orange-500/10 text-orange-400 border-orange-500/30'
                  }`}>
                    {order.type === 'dine-in' ? order.tableNumber : 'Dine-Out'}
                  </span>
                </div>
                <div className="text-xs font-semibold text-slate-300 mt-1">
                  {order.studentName}
                </div>
              </div>

              <div className="text-right">
                <span className="text-[11px] text-slate-400 font-mono-num block">{order.time}</span>
                <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-md inline-block mt-1 ${
                  isCooking
                    ? 'bg-amber-500/20 text-amber-300'
                    : isReady
                    ? 'bg-emerald-500/20 text-emerald-300'
                    : 'bg-sky-500/20 text-sky-300'
                }`}>
                  {order.status}
                </span>
              </div>
            </div>

            {/* Special Instructions Alert */}
            {order.specialNotes && (
              <div className="mt-2.5 bg-amber-500/10 border border-amber-500/30 rounded-lg p-2 text-xs text-amber-300 font-medium">
                Note: {order.specialNotes}
              </div>
            )}

            {/* Dish Items Checklist for Chef */}
            <div className="mt-3 space-y-1.5">
              <span className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">
                Kitchen Checklist:
              </span>
              {order.items.map((item, idx) => {
                const done = checkedItems[idx];
                return (
                  <button
                    type="button"
                    key={idx}
                    onClick={() => toggleCheck(idx)}
                    className={`w-full text-left p-2 rounded-lg text-xs font-medium flex items-center justify-between border transition ${
                      done
                        ? 'bg-slate-950/60 border-slate-800 text-slate-500 line-through'
                        : 'bg-slate-950 border-slate-800 text-slate-200 hover:border-slate-700'
                    }`}
                  >
                    <span>{item.qty} × {item.name}</span>
                    <span className={`text-[10px] px-1.5 py-0.5 rounded ${done ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400'}`}>
                      {done ? 'Cooked' : 'Prep'}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Action Transition Buttons */}
          <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
            <button
              type="button"
              onClick={() => onDeleteOrder(order.id || order.orderId || order._id)}
              title="Cancel Ticket"
              className="p-2 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition"
            >
              <Icons.Trash className="w-4 h-4" />
            </button>

            {order.status === 'ordered' && (
              <button
                type="button"
                onClick={() => onStatusChange(order.id || order.orderId || order._id, 'cooking')}
                className="flex-1 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl text-xs transition shadow flex items-center justify-center space-x-1"
              >
                <Icons.ChefHat className="w-3.5 h-3.5" />
                <span>Start Cooking</span>
              </button>
            )}

            {order.status === 'cooking' && (
              <button
                type="button"
                onClick={() => onStatusChange(order.id || order.orderId || order._id, 'ready')}
                className="flex-1 py-2 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950 font-bold rounded-xl text-xs transition shadow flex items-center justify-center space-x-1"
              >
                <Icons.Bell className="w-3.5 h-3.5" />
                <span>Finish & Call Dispatch</span>

            {order.status === 'ready' && (
              <button
                type="button"
                onClick={() => onStatusChange(order.id || order.orderId || order._id, 'delivered')}
                className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs transition border border-slate-700"

                <span>Delivered</span>

              <button

                onClick={() => onStatusChange(order.id || order.orderId || order._id, 'cooking')}
                className="text-xs text-slate-500 hover:text-slate-300 underline"

                Re-open
              </button>
            )}

        </div>

                Dishes finished in the Kitchen will pop up here ready for serving.
              </p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {filtered.map(order => (
                <div
                  key={order.id}
                  className={`bg-slate-900 border rounded-2xl p-4 flex flex-col justify-between transition-all ${
                    order.status === 'ready'
                      ? 'border-emerald-500/50 ring-1 ring-emerald-500/30'
                      : 'border-slate-800 opacity-80'
                  }`}
                >
                  <div>
                    <div className="flex items-start justify-between pb-3 border-b border-slate-800">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="text-3xl font-black font-mono-num text-white">
                            #{order.token}
                          </span>
                          <span className={`text-xs uppercase font-extrabold px-2.5 py-1 rounded-lg ${
                            order.type === 'dine-in'
                              ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40'
                              : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                          }`}>
                            {order.type === 'dine-in' ? order.tableNumber : 'Dine-Out Pickup'}
                          </span>
                        </div>
                        <div className="text-sm font-bold text-slate-200 mt-1">
                          {order.studentName}
                        </div>
                      </div>

                      <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${
                        order.status === 'ready'
                          ? 'bg-emerald-500 text-slate-950'
                          : 'bg-amber-500/20 text-amber-400'
                      }`}>
                        {order.status === 'ready' ? 'Ready to Serve' : 'Cooking in Kitchen'}
                      </span>
                    </div>

                    <div className="mt-3 space-y-1 text-xs text-slate-300">
                      <div className="text-slate-400 text-[11px] font-medium">Order Items:</div>
                      {order.items.map((i, idx) => (
                        <div key={idx} className="flex justify-between font-medium">
                          <span>{i.qty || i.quantity} × {i.name}</span>
                          <span className="font-mono-num text-slate-400">₹{i.price * (i.qty || i.quantity)}</span>
                        </div>
                      ))}
                    </div>

                    {order.specialNotes && (
                      <div className="mt-2.5 text-[11px] bg-slate-950 p-2 rounded-lg text-amber-300 border border-slate-800">
                        Instructions: {order.specialNotes}
                      </div>
                    )}
                  </div>

                  {/* Dispatch Controls */}
                  <div className="mt-4 pt-3 border-t border-slate-800 flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => onAnnounce(order.token || order.tokenNumber, order.type === 'dine-in' ? order.tableNumber : 'Takeaway')}
                      className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-xl text-xs font-bold transition flex items-center space-x-1"
                      title="Ring chime and announce"
                    >
                      <Icons.Bell className="w-3.5 h-3.5" />
                      <span>Ring Chime</span>
                    </button>

                    {order.status === 'ready' ? (
                      <button
                        type="button"
                        onClick={() => onStatusChange(order.id || order.orderId || order._id, 'delivered')}
                        className="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs transition flex items-center justify-center space-x-1.5 shadow"
                      >
                        <Icons.CheckCircle className="w-4 h-4 stroke-[2.5]" />
                        <span>
                          {order.type === 'dine-in' ? 'Deliver to Table' : 'Handover to Student'}
                        </span>
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={() => onStatusChange(order.id || order.orderId || order._id, 'ready')}
                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition border border-slate-700"
                      >
                        Fast-Track to Ready
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function DigitalSignageBoard({ readyQueue, cookingQueue, orderedQueue, lastAnnouncedToken }) {
      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 flex items-center justify-between shadow-xl">
            <div className="flex items-center space-x-3">
              <span className="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></span>
              <div>
                <h2 className="text-base sm:text-lg font-black uppercase tracking-wider text-white">
                  Cafeteria Public Display Screen
                </h2>
                <p className="text-xs text-slate-400">Large digital signage for students waiting in the dining hall</p>
              </div>
            </div>

            <div className="text-xs text-slate-400 font-mono-num bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
              Live: {new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            {/* COLUMN 1: NOW READY / SERVING */}
            <div className="bg-slate-900/90 border-2 border-emerald-500/40 rounded-3xl p-6 shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[420px]">
              <div className="absolute top-0 right-0 w-48 h-48 bg-emerald-500/10 blur-3xl pointer-events-none"></div>

              <div>
                <div className="flex items-center justify-between pb-4 border-b border-emerald-500/20 mb-5">
                  <div className="flex items-center space-x-2">
                    <span className="w-3.5 h-3.5 rounded-full bg-emerald-400 inline-block"></span>
                    <h3 className="text-2xl font-black uppercase tracking-wider text-emerald-400">
                      Now Ready For Pickup
                    </h3>
                  </div>
                  <span className="bg-emerald-500/20 text-emerald-300 font-extrabold px-3 py-1 rounded-full text-xs font-mono-num">
                    {readyQueue.length} Ready
                  </span>
                </div>

                {readyQueue.length === 0 ? (
                  <div className="py-16 text-center text-slate-500 space-y-2">
                    <Icons.Coffee className="w-10 h-10 mx-auto text-slate-600" />
                    <p className="text-sm font-semibold">All called orders have been collected.</p>
                    <p className="text-xs text-slate-600">Your token will illuminate here as soon as it is hot!</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3.5">
                    {readyQueue.map(order => {
                      const isRecent = order.token === lastAnnouncedToken;
                      return (
                        <div
                          key={order.id}
                          className={`relative rounded-2xl p-4 text-center border transition-all duration-300 ${
                            isRecent
                              ? 'bg-gradient-to-b from-emerald-500/25 to-slate-900 border-emerald-400 ring-2 ring-emerald-400/50 shadow-xl shadow-emerald-500/20 scale-105'
                              : 'bg-slate-800/80 border-emerald-500/30'
                          }`}
                        >
                          {isRecent && (
                            <span className="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-emerald-400 text-slate-950 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full shadow">
                              Just Called!
                            </span>
                          )}
                          <div className="text-4xl font-black text-emerald-300 font-mono-num tracking-tight">
                            #{order.token}
                          </div>
                          <div className="mt-2 text-xs font-bold text-emerald-400/90 bg-emerald-950/70 py-1 px-2 rounded-lg border border-emerald-500/30 truncate">
                            {order.type === 'dine-in' ? order.tableNumber : 'Takeaway Pack'}
                          </div>
                          <div className="mt-1 text-[11px] text-slate-300 font-medium truncate">
                            {order.studentName}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              <div className="text-[11px] text-emerald-400/80 font-medium pt-4 border-t border-emerald-500/20 mt-6 flex items-center justify-between">
                <span>Please present your token ticket at the counter</span>
                <span>Bon Appétit!</span>
              </div>
            </div>

            {/* COLUMN 2: COOKING NOW & UPCOMING QUEUE */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col justify-between min-h-[420px]">
              <div>
                <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-5">
                  <div className="flex items-center space-x-2">
                    <Icons.Clock className="w-5 h-5 text-amber-400" />
                    <h3 className="text-2xl font-black uppercase tracking-wider text-amber-400">
                      Preparing Now
                    </h3>
                  </div>
                  <span className="bg-amber-500/20 text-amber-300 font-extrabold px-3 py-1 rounded-full text-xs font-mono-num">
                    {cookingQueue.length} Cooking
                  </span>
                </div>

                {cookingQueue.length === 0 ? (
                  <div className="py-12 text-center text-slate-500 text-xs">
                    No orders currently on the grill.
                  </div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {cookingQueue.map(order => (
                      <div
                        key={order.id}
                        className="bg-slate-800/60 border border-amber-500/20 rounded-xl p-3 text-center"
                      >
                        <div className="text-3xl font-black text-amber-300 font-mono-num">
                          #{order.token}
                        </div>
                        <div className="text-[11px] text-slate-300 mt-1 font-semibold truncate">
                          {order.type === 'dine-in' ? order.tableNumber : 'Dine-Out'}
                        </div>
                        <div className="text-[10px] text-slate-500 truncate">
                          {order.studentName}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Waiting in Queue Line */}
              <div className="mt-6 pt-4 border-t border-slate-800">
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Up Next In Queue Line ({orderedQueue.length})
                  </span>
                  <span className="text-[11px] text-slate-500 font-mono-num">Estimated ~3-5m wait</span>
                </div>

                {orderedQueue.length === 0 ? (
                  <p className="text-xs text-slate-500 italic">Kitchen queue is clear.</p>
                ) : (
                  <div className="flex flex-wrap gap-2">
                    {orderedQueue.map((order, idx) => (
                      <div
                        key={order.id}
                        className="inline-flex items-center space-x-1 px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 border border-slate-700 text-xs font-mono-num"
                      >
                        <span className="text-[10px] text-slate-500 font-sans">#{idx + 1}</span>
                        <span className="font-bold text-white">#{order.token}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
